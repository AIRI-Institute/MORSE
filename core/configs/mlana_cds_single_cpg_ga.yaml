schema_version: 5
name: mlana_cds_single_cpg_ga
# Results folder.
output_dir: ../../outputs/mlana_cds_single_cpg_ga

# Input RNA and parts.
construct:
  fasta: inputs/mlana_cds_single_cpg_ga/input.fasta
  coordinates:  # 0-based; end excluded.
    five_prime_utr: [0, 75]
    cds: [75, 426]  # Body only.
    three_prime_utr: [426, 464]
    poly_a: [464, 584]

  start_codon: [AUG]
  stop_codon: [UAA]

  # Unlisted parts stay fixed.
  changes:
    cds: synonymous

# Search settings.
optimizer:
  algorithm: ga
  population_size: 32
  generations: 60
  seed: 43
  n_offsprings: 32
  eliminate_duplicates: true
  crossover:
    type: uniform
    probability: 0.9
  mutation:
    type: integer_reset
    probability: auto
  constraint_handling:
    method: adaptive_epsilon
    normalization: relative
    initial_epsilon: 0.5
    relaxation_generations: 12
    curve: cosine
  early_stopping:
    enabled: true
    metric: best_feasible_objective
    min_generations: 25
    patience: 12
    rel_tol: 0.001
    abs_tol: 0.05

# Prepared scorer commands.
scorers:
  - name: sequence_quality
    command: '"${MORSE_PYTHON}" -m morse.sequence_quality'
    scope: [five_prime_utr, cds, three_prime_utr]
    metrics:  # Goals, limits and logs.
      cpg_per_kb:
        role: optimize
        direction: min
      non_polya_max_homopolymer:
        role: threshold
        max: 4
        value_type: int
      body_gc_window_min:
        role: threshold
        min: 0.35
      body_gc_window_max:
        role: threshold
        max: 0.65
      upa_per_kb:
        role: log
      repeated_12mer_count:
        role: log
        value_type: int
