[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "morse-core"
version = "0.4.0"
description = "Modular multi-objective optimization of full-length mRNA vaccine sequences."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "cloudpickle>=3.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pymoo>=0.6.1,<0.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.1"]

[project.scripts]
morse-core = "morse.cli:main"
morse-backend = "morse.backend:main"

[tool.setuptools]
packages = ["morse"]

[tool.setuptools.package-data]
morse = ["resources/*.py"]
