schema_version: 4
name: f3a_morse_s137
# Results folder.
output_dir: ../../outputs/paper-runs/F3A_morse_s137

# Input RNA and parts.
construct:
  fasta: ../inputs/schema4/f3a_morse_s137_reference.fasta
  coordinates:  # 0-based; end excluded.
    five_prime_utr: [0, 75]
    cds: [75, 432]
    three_prime_utr: [432, 470]
    poly_a: [470, 570]

  # Unlisted parts stay fixed.
  changes:
    cds: synonymous

# Search settings.
optimizer:
  algorithm: nsga3
  population_size: 64
  n_offsprings: 64
  generations: 256
  seed: 137
  eliminate_duplicates: true
  crossover:
    type: uniform
    probability: 0.9
  mutation:
    type: integer_reset
    probability: auto
  reference_directions:
    method: energy
    n_points: 64
    seed: 137
  constraint_handling:
    method: feasibility_first
  early_stopping:
    enabled: false
  initial_population_audit: ../inputs/schema4/f3a_morse_s137_initial.json
manufacturability:
  enabled: false

# Prepared scorer commands.
scorers:
  - name: viennarna_transcript_body
    command: 'curl -fsS -H ''Content-Type: application/json'' --data-binary @- http://127.0.0.1:8706/score'
    timeout_seconds: 1800
    scope: [five_prime_utr, cds, three_prime_utr]
    metrics:  # Goals, limits and logs.
      mfe_per_nt:
        role: optimize
        direction: min
      mfe:
        role: log
      mfe_structure:
        role: log
        value_type: structure
  - name: csi_human
    command: 'curl -fsS -H ''Content-Type: application/json'' --data-binary @- http://127.0.0.1:8707/score'
    timeout_seconds: 1800
    scope: [start_codon, cds_body]
    metrics:  # Goals, limits and logs.
      csi_percentile:
        role: optimize
        direction: max
      csi_raw:
        role: log
      csi_codons:
        role: log
        value_type: int
      csi_profile_sha256:
        role: log
        value_type: string
